<div class="card-top"><h1 class="detail-title">(be) its / their own thing</h1><span class="tag" data-tone="口语">口语</span></div>
<p class="meaning">自成一类，独树一帜，不能简单归入别的类别。后面的 thing 用单数。</p>
<p class="use"><strong>快速定位：</strong>强调自成一类</p>
<div class="examples"><div class="example"><div class="en">Podcasts are kind of their own thing.</div><div class="zh">播客算是自成一类的东西。</div></div><div class="example"><div class="en">Swiss German isn&#39;t just a dialect — it&#39;s its own thing.</div><div class="zh">瑞士德语不只是方言，它自成一体。</div></div><div class="example"><div class="en">Let her do her own thing.</div><div class="zh">（do one’s own thing：按自己的方式做）让她按自己的方式来吧。</div></div></div>
