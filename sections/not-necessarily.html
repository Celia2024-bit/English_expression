<div class="card-top"><h1 class="detail-title">not necessarily</h1><span class="tag" data-tone="通用">通用</span></div>
<p class="meaning">不一定；未必。是部分否定，比直接说 not 更缓和，承认“有时成立、但不绝对”，不把话说死。</p>
<p class="use"><strong>快速定位：</strong>委婉地表示不一定</p>
<div class="examples"><div class="example"><div class="en">That&#39;s not necessarily true.</div><div class="zh">那不一定是真的。</div></div><div class="example"><div class="en">A higher price doesn&#39;t necessarily mean better quality.</div><div class="zh">价格高不一定意味着质量更好。</div></div><div class="example"><div class="en">Is the newest version always the best? — Not necessarily.</div><div class="zh">最新版本总是最好的吗？——不一定。</div></div></div>
