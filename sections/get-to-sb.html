<div class="card-top"><h1 class="detail-title">get to sb / it gets me when...</h1><span class="tag" data-tone="口语">口语</span></div>
<p class="meaning">让人心烦、受影响，多指某件事慢慢消耗你的耐心或承受力。表示“让我很火大”时，也常说 It really gets me when...。</p>
<p class="use"><strong>快速定位：</strong>让人心烦、受不了</p>
<div class="examples"><div class="example"><div class="en">His attitude really gets to me.</div><div class="zh">他的态度真让我心烦。</div></div><div class="example"><div class="en">The pressure is starting to get to him.</div><div class="zh">压力开始压得他受不了了。</div></div><div class="example"><div class="en">It really gets me when people don&#39;t reply.</div><div class="zh">别人不回消息的时候，我真的很恼火。</div></div></div>
